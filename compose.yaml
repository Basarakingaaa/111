name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}

services:
  caddy:
    image: ${CADDY_IMAGE:?set CADDY_IMAGE}
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL}
    ports:
      - "${HTTP_PORT:?set HTTP_PORT}:80"
      - "${HTTPS_PORT:?set HTTPS_PORT}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, backend]
    depends_on: [web, core]

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE}
    restart: unless-stopped
    networks: [edge]

  core:
    image: ${CORE_IMAGE:?set CORE_IMAGE}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      DB_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET}
      APP_CONFIG_ENCRYPTION_KEY: ${APP_CONFIG_ENCRYPTION_KEY:?set APP_CONFIG_ENCRYPTION_KEY}
      APP_BOOTSTRAP_ADMIN_GITHUB_LOGIN: ${APP_BOOTSTRAP_ADMIN_GITHUB_LOGIN:?set APP_BOOTSTRAP_ADMIN_GITHUB_LOGIN}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:?set GITHUB_OAUTH_CLIENT_ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:?set GITHUB_OAUTH_CLIENT_SECRET}
      CORE_AGENT_TOKEN: ${CORE_AGENT_TOKEN:?set CORE_AGENT_TOKEN}
      CORE_INDEXER_TOKEN: ${CORE_INDEXER_TOKEN:?set CORE_INDEXER_TOKEN}
      AGENT_URL: http://agent:8000
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:?set APP_LOG_LEVEL}
      APP_TIME_ZONE: ${APP_TIME_ZONE:?set APP_TIME_ZONE}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:?set UPLOAD_MAX_BYTES}
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  agent:
    image: ${AGENT_IMAGE:?set AGENT_IMAGE}
    restart: unless-stopped
    environment:
      CORE_URL: http://core:8080
      CORE_AGENT_TOKEN: ${CORE_AGENT_TOKEN:?set CORE_AGENT_TOKEN}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD}
      MODEL_PROVIDER: ${MODEL_PROVIDER:?set MODEL_PROVIDER}
      MODEL_BASE_URL: ${MODEL_BASE_URL:?set MODEL_BASE_URL}
      MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY}
      MODEL_NAME: ${MODEL_NAME:?set MODEL_NAME}
      AGENT_MAX_CONTEXT_TOKENS: ${AGENT_MAX_CONTEXT_TOKENS:?set AGENT_MAX_CONTEXT_TOKENS}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:?set APP_LOG_LEVEL}
    networks: [edge, backend]
    depends_on: [core, elasticsearch]

  indexer:
    image: ${INDEXER_IMAGE:?set INDEXER_IMAGE}
    restart: unless-stopped
    environment:
      CORE_URL: http://core:8080
      CORE_INDEXER_TOKEN: ${CORE_INDEXER_TOKEN:?set CORE_INDEXER_TOKEN}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:?set MINIO_BUCKET}
      MODEL_PROVIDER: ${MODEL_PROVIDER:?set MODEL_PROVIDER}
      MODEL_BASE_URL: ${MODEL_BASE_URL:?set MODEL_BASE_URL}
      MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?set EMBEDDING_MODEL}
      INDEXER_WORKERS: ${INDEXER_WORKERS:?set INDEXER_WORKERS}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:?set APP_LOG_LEVEL}
    networks: [backend]
    depends_on: [core, elasticsearch, minio]

  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: ${APP_TIME_ZONE:?set APP_TIME_ZONE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:?set REDIS_IMAGE}
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:?set ELASTICSEARCH_IMAGE}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:?set ES_JAVA_OPTS}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health"]
      interval: 20s
      timeout: 10s
      retries: 20

  minio:
    image: ${MINIO_IMAGE:?set MINIO_IMAGE}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  edge:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  elasticsearch_data:
  minio_data:
