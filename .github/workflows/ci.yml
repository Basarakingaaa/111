name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B verify
        working-directory: services/core

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  python-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/agent/requirements.txt -r services/indexer/requirements.txt pytest
      - run: pytest services/indexer/tests
        env: { PYTHONPATH: services/indexer }
      - name: Verify seven agent definitions
        run: python -c "from app.agents import AGENTS; assert len(AGENTS) == 7"
        env:
          PYTHONPATH: services/agent
          CORE_URL: http://core:8080
          CORE_AGENT_TOKEN: test-token
          ELASTICSEARCH_URL: http://elasticsearch:9200
          ELASTICSEARCH_USERNAME: elastic
          ELASTICSEARCH_PASSWORD: test-password
          MODEL_PROVIDER: test
          MODEL_BASE_URL: http://model.invalid/v1
          MODEL_API_KEY: test-key
          MODEL_NAME: test-model

